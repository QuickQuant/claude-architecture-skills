function objectInspector(o){if(o.object_kind==='input parameter'){const owner=get('symbol',o.owner);return`<div class="eyebrow">input binding</div><h2>${esc(o.name)}</h2><p>Value supplied to <strong>${esc(owner?.qualified_name||'the callable')}</strong>. Binding this parameter does not imply that the callable copies, stores, or owns the supplied value.</p><dl class="kv"><dt>Type</dt><dd><code>${esc(o.annotation||'untyped')}</code></dd><dt>Passing mode</dt><dd>${esc((o.parameter_kind||'positional').replaceAll('-',' '))}</dd><dt>Default</dt><dd>${o.default===null?'required':`<code>${esc(o.default)}</code>`}</dd></dl>${o.uses?.length?`<h3>Observed body uses</h3><div class="data-list">${o.uses.slice(0,16).map(use=>`<div class="data-row"><b>L${use.line}</b><code>${esc(use.expression)}</code><span>${esc(use.context)}</span></div>`).join('')}</div>`:'<p>No direct read was recovered from the callable body.</p>'}${o.source?`<h3>Declaration evidence</h3><div class="source">${esc(o.source)}</div>`:''}<div class="limit-note">These are syntactic reads, not runtime frequency. Inspect explicit copying, slicing, serialization, mutation, or retained-state assignment separately; parameter binding alone proves none of them.</div>`}if(o.object_kind==='field')return`<div class="eyebrow">class field</div><h2>${esc(o.name)}</h2><p>${esc(o.summary||'Statically recovered class state.')}</p>${o.source?`<div class="source">${esc(o.source)}</div>`:''}`;const w=currentWorkflow(),occ=w.steps.filter(x=>x.objects.includes(o.name));return`<div class="eyebrow">workflow data</div><h2>${esc(o.name)}</h2><p>${esc(o.summary||'Workflow data object or state value.')}</p>${o.source?`<div class="source">${esc(o.source)}</div>`:''}<h3>Workflow occurrences</h3><div class="data-list">${occ.map(x=>`<button class="call-button" data-step="${w.steps.indexOf(x)}"><b>${esc(x.title)}</b><small>${esc(x.effect)}</small></button>`).join('')||'<p>No authored trace occurrence.</p>'}</div>`}
function wireSelect(root){root.querySelectorAll('[data-select]').forEach(b=>b.onclick=e=>{e.preventDefault();const type=b.dataset.select,id=b.dataset.id;if(type==='object'){const child=childrenFor(state.type,get(state.type,state.id)).find(x=>x.type==='object'&&x.item.id===id);select(type,id,{item:child?.item})}else select(type,id)});root.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>goStep(Number(b.dataset.step)))}
function moveStep(delta){const w=currentWorkflow(),next=Math.max(0,Math.min(w.steps.length-1,state.step+delta));if(next===state.step){if(state.playing)togglePlay();return}goStep(next)}
function goStep(index){const step=currentWorkflow().steps[index];state.interacted=true;state.step=index;state.type='symbol';state.id=step.symbol;setHash()}
function togglePlay(){state.playing=!state.playing;if(state.playing){if(state.step===currentWorkflow().steps.length-1){state.step=0;state.type='symbol';state.id=currentStep().symbol;setHash()}timer=setInterval(()=>{if(state.step>=currentWorkflow().steps.length-1){togglePlay();return}goStep(state.step+1)},2600)}else{clearInterval(timer);timer=null}renderTrace()}
function renderTrace(){const w=currentWorkflow(),s=currentStep();$('#trace-name').textContent=w.name;$('#trace-status').textContent=w.status+' · failure branches intentionally summarized';$('#step-count').textContent=`${state.step+1} / ${w.steps.length}`;$('#prev-step').disabled=state.step===0;$('#next-step').disabled=state.step===w.steps.length-1;$('#play-step').setAttribute('aria-label',state.playing?'Pause workflow':'Play workflow');$('#play-icon').classList.toggle('hidden-icon',state.playing);$('#pause-icon').classList.toggle('hidden-icon',!state.playing);$('#step-track').style.setProperty('--steps',w.steps.length);$('#step-track').innerHTML=w.steps.map((x,i)=>`<button class="step-dot ${i<state.step?'done':''} ${i===state.step?'active':''}" data-step="${i}" aria-label="Step ${i+1}: ${esc(x.title)}" ${i===state.step?'aria-current="step"':''}><span>${String(i+1).padStart(2,'0')}</span><small>${esc(x.title)}</small></button>`).join('');$('#step-detail').innerHTML=`<div class="step-summary"><span class="kind">${esc(s.kind)} · ${esc(s.source)}</span><h3>${esc(s.title)}</h3><p>${esc(s.summary)}</p></div><div class="flow-cell"><b>Input</b><div>${s.input.map(x=>`<button class="object-chip" data-object="${esc(x)}">${esc(x)}</button>`).join('')}</div></div><div class="flow-cell condition-cell"><b>Why this step runs</b><p>${esc(s.condition)}</p>${s.source_guard?`<code class="source-guard">Source guard: ${esc(s.source_guard)}</code>`:''}</div><div class="flow-cell"><b>Action</b><p>${esc(s.effect)}</p></div><div class="flow-cell output-cell"><b>Output</b><div>${s.output.map(x=>`<button class="object-chip" data-object="${esc(x)}">${esc(x)}</button>`).join('')}</div></div>`;$$('[data-step]').forEach(b=>b.onclick=()=>goStep(Number(b.dataset.step)));$$('[data-object]').forEach(b=>b.onclick=()=>{const name=b.dataset.object,cls=D.classes.find(c=>c.name===name);if(cls)select('class',cls.id);else{const id=`object:${name}`,o={id,name,summary:`Data participating in ${w.name}.`,source:s.source};maps.object=maps.object||new Map;maps.object.set(id,o);select('object',id)}})}
function renderSearch(){const q=$('#search').value.trim().toLowerCase(),root=$('#search-results');if(q.length<2){root.classList.remove('open');root.innerHTML='';return}const results=[];for(const type of['subsystem','component','class','symbol','module'])for(const item of maps[type].values()){const hay=(label(type,item)+' '+(item.file||'')+' '+(item.summary||'')).toLowerCase();if(hay.includes(q))results.push({type,item});if(results.length>=35)break}root.innerHTML=results.map((r,i)=>`<button class="search-result" data-search="${i}" role="option"><b>${esc(label(r.type,r.item))}</b><small>${esc(r.type+' · '+(r.item.file||r.item.summary||''))}</small></button>`).join('')||'<div class="empty">No match</div>';root.classList.add('open');root.querySelectorAll('[data-search]').forEach((b,i)=>b.onclick=()=>{const r=results[i];$('#search').value='';root.classList.remove('open');select(r.type,r.item.id)})}
function renderCoverage(){const c=D.coverage;$('#coverage-grid').innerHTML=[[`${c.architecture_files_read}/${c.architecture_files_total}`,'architecture files read'],[c.class_count,'classes indexed'],[c.python_symbol_count,'Python callables indexed'],[c.call_site_count,'static call expressions']].map(x=>`<div class="coverage-item"><b>${x[0]}</b><span>${x[1]}</span></div>`).join('');$('#coverage-limits').innerHTML=`<strong>Declared limits:</strong> ${c.symbol_limits.map(esc).join(' ')} The workflow player is an authored, source-backed happy path—not runtime instrumentation.`;$('#coverage-hashes').innerHTML=`Architecture ${esc(c.architecture_hash)}<br>Class ledger ${esc(c.class_inventory_hash)}<br>Symbol ledger ${esc(c.symbol_inventory_hash)}`}
setup();
})();
</script>
